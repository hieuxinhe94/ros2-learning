controller_manager:
  ros__parameters:
    update_rate: 10

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_joint
      - elbow_joint
      - wrist_joint
    state_publish_rate: 50
    command_interfaces:
      - position
    action_monitor_rate: 20.0
    state_interfaces:
      - position
      - velocity
    gains:
      shoulder_joint: { p: 20.0, i: 0.0, d: 1.0 }
      elbow_joint: { p: 20.0, i: 0.0, d: 1.0 }
      wrist_joint: { p: 20.0, i: 0.0, d: 1.0 }      

